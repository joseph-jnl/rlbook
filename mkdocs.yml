site_name: "rlbook: joseph-jnl"

site_url: https://joseph-jnl.github.io/rlbook
repo_url: https://github.com/joseph-jnl/rlbook

theme:
  name: material
  palette:
    scheme: slate
    primary: black
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.expand
    - navigation.tabs
    - content.code.copy
    - navigation.top
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths: [src]
        options:
          heading_level: 2
          show_root_heading: true
- glightbox

markdown_extensions:
  - pymdownx.blocks.caption
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Setup: setup.md
  - Chapters:
    - "2: Multi-armed Bandits": chap2_bandits.md
    - "3: Finite Markov Decision Processes": chap3_finite_mdps.md
  - API:
    - Bandits: api_bandits.md
    - Grid Worlds: api_gridworlds.md